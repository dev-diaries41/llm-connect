[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_connect"
version = "0.1.0"
description = "Lightweight library for connecting to LLM providers"
requires-python = ">=3.10"

dependencies = [
    "openai==2.14.0",
    "pytest==9.0.2",
    "pytest-asyncio",
    "pydantic>=2.0,<3.0"
]


[tool.setuptools.packages.find]
include = ["llm_connect*"]